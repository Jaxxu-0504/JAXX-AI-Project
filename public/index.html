<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAXX AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(rgba(3, 8, 25, 0.78), rgba(3, 8, 25, 0.9)),
        url("/background.png") center/cover fixed;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 250px;
    background: rgba(4, 10, 30, 0.82);
    backdrop-filter: blur(18px);
    border-right: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: rgba(40, 100, 255, 0.25);
    color: white;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.new-chat:hover {
    background: rgba(40, 100, 255, 0.45);
}

.sidebar-footer {
    margin-top: auto;
    color: #8d96b5;
    font-size: 12px;
    text-align: center;
}

/* ================= MAIN ================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    background: rgba(4, 10, 30, 0.55);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.top-title {
    font-size: 19px;
    font-weight: bold;
}

.online {
    font-size: 13px;
    color: #62ff9b;
}

/* ================= CHAT ================= */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 8%;
    scroll-behavior: smooth;
}

.welcome {
    text-align: center;
    margin-top: 12vh;
}

.welcome h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.welcome p {
    color: #9aa4c5;
}

.message {
    display: flex;
    margin: 15px 0;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user .bubble {
    background: rgba(43, 103, 255, 0.45);
    border-bottom-right-radius: 5px;
}

.message.ai .bubble {
    background: rgba(255,255,255,0.07);
    border-bottom-left-radius: 5px;
}

/* ================= SUGGESTIONS ================= */

.suggestions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 0 20px 12px;
}

.suggestion {
    padding: 9px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #dce3ff;
    cursor: pointer;
    transition: 0.2s;
}

.suggestion:hover {
    background: rgba(60,110,255,0.2);
}

/* ================= VIDEO BUTTON ================= */

.video-toggle {
    display: block;
    margin: 0 auto 10px;
    padding: 9px 16px;
    border: 1px solid rgba(100,150,255,0.25);
    border-radius: 20px;
    background: rgba(40,90,255,0.14);
    color: #dce6ff;
    cursor: pointer;
    transition: 0.2s;
}

.video-toggle:hover {
    background: rgba(40,90,255,0.3);
}

/* ================= VIDEO PANEL ================= */

.video-panel {
    width: min(700px, 90%);
    margin: 0 auto 12px;
    padding: 15px;
    background: rgba(5, 12, 35, 0.9);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 17px;
    backdrop-filter: blur(20px);
    display: none;
}

.video-panel.show {
    display: block;
}

.video-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.video-prompt {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
    outline: none;
    background: rgba(255,255,255,0.06);
    color: white;
    font-family: inherit;
}

.video-prompt::placeholder {
    color: #7f89aa;
}

.video-options {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.video-options label {
    color: #9da8c8;
    font-size: 13px;
}

.video-options select {
    margin-left: 5px;
    background: #0c1538;
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 7px 10px;
    border-radius: 8px;
}

.video-generate {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(90deg, #315eff, #704cff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.video-generate:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.video-status {
    text-align: center;
    color: #9da8c8;
    margin-top: 10px;
    font-size: 13px;
}

/* ================= VIDEO RESULT ================= */

.video-result {
    margin-top: 12px;
}

.generated-video {
    width: 100%;
    max-width: 600px;
    border-radius: 14px;
    display: block;
    margin-top: 10px;
    background: black;
}

.download-video {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 13px;
    border-radius: 9px;
    background: rgba(50,100,255,0.25);
    color: white;
    text-decoration: none;
    font-size: 13px;
}

/* ================= INPUT ================= */

.input-area {
    padding: 10px 8% 20px;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 900px;
    margin: auto;
    padding: 8px;
    border-radius: 17px;
    background: rgba(10, 20, 50, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(18px);
}

#messageInput {
    flex: 1;
    min-height: 42px;
    max-height: 150px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 11px;
    font-family: inherit;
    font-size: 15px;
}

#messageInput::placeholder {
    color: #7f89aa;
}

.attach {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    position: relative !important;
    z-index: 99999 !important;

    width: 42px;
    height: 42px;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    font-size: 20px;
}

.attach:hover {
    background: rgba(255,255,255,0.12);
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #315eff;
    color: white;
    cursor: pointer;
    font-size: 19px;
}

.send:hover {
    background: #416cff;
}

.file-preview {
    max-width: 900px;
    margin: 7px auto 0;
    padding: 7px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
}

.file-preview.show {
    display: flex;
}

.remove-file {
    border: none;
    background: transparent;
    color: #ff7070;
    cursor: pointer;
    font-size: 16px;
}

/* ================= TYPING ================= */

.typing {
    display: flex;
    gap: 5px;
    padding: 5px;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9ca9ff;
    animation: typing 1s infinite alternate;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes typing {
    from { opacity: .2; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(-2px); }
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .chat {
        padding: 25px 15px;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .bubble {
        max-width: 88%;
    }

    .input-area {
        padding: 10px 10px 15px;
    }

    .video-panel {
        width: calc(100% - 20px);
    }

    .topbar {
        padding: 0 15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">JAXX</div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="sidebar-footer">
            Created & developed by Ansh 😎
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">
            <div class="top-title">JAXX AI</div>
            <div class="online">● Online</div>
        </header>


        <!-- CHAT -->
        <section class="chat" id="chat">

            <div class="welcome" id="welcome">
                <h1>Hey 👋 I'm JAXX</h1>
                <p>Your AI assistant — ask me anything.</p>
            </div>

        </section>


        <!-- INPUT AREA -->
        <div class="input-area">

            <!-- SUGGESTIONS -->
            <div class="suggestions" id="suggestions">

                <button class="suggestion"
                    onclick="useSuggestion('Explain something in simple words')">
                    Explain something
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Help me with coding')">
                    Help with coding
                </button>

                <button class="suggestion"
                    onclick="useSuggestion('Give me some creative ideas')">
                    Give me ideas
                </button>

            </div>


            <!-- VIDEO TOGGLE -->
            <button class="video-toggle" onclick="toggleVideoPanel()">
                🎬 Create AI Video
            </button>


            <!-- VIDEO GENERATOR -->
            <div class="video-panel" id="videoPanel">

                <div class="video-title">
                    🎬 JAXX AI Video Generator
                </div>

                <textarea
                    id="videoPrompt"
                    class="video-prompt"
                    placeholder="Describe the video you want...&#10;&#10;Example: A futuristic city at night, neon lights, cinematic camera movement..."
                    maxlength="2000"></textarea>

                <div class="video-options">

                    <label>
                        Duration:
                        <select id="videoDuration">
                            <option value="2">2 seconds</option>
                            <option value="5" selected>5 seconds</option>
                            <option value="10">10 seconds</option>
                        </select>
                    </label>

                    <label>
                        Ratio:
                        <select id="videoRatio">
                            <option value="1280:720" selected>16:9 Landscape</option>
                            <option value="720:1280">9:16 Portrait</option>
                        </select>
                    </label>

                </div>

                <button
                    class="video-generate"
                    id="generateVideoBtn"
                    onclick="generateVideo()">
                    ✨ Generate Video
                </button>

                <div class="video-status" id="videoStatus"></div>

            </div>


            <!-- FILE PREVIEW -->
            <div class="file-preview" id="filePreview">
                <span id="fileName"></span>
                <button class="remove-file" onclick="removeFile()">✕</button>
            </div>


            <!-- MESSAGE INPUT -->
            <div class="input-box">

                <label class="attach" title="Attach file">
                    📎
                    <input
                        type="file"
                        id="fileInput"
                        hidden
                        onchange="handleFile(this)">
                </label>

                <textarea
                    id="messageInput"
                    placeholder="Message JAXX..."
                    rows="1"></textarea>

                <button class="send" onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* ================= VARIABLES ================= */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");
const fileName = document.getElementById("fileName");
const suggestions = document.getElementById("suggestions");

let selectedFile = null;


/* ================= LOAD CHAT ================= */

function loadChat() {

    const saved = localStorage.getItem("jaxx_messages");

    if (!saved) return;

    try {

        const messages = JSON.parse(saved);

        if (!messages.length) return;

        document.getElementById("welcome")?.remove();

        messages.forEach(message => {
            addMessageToUI(message.role, message.content);
        });

    } catch (error) {

        console.error("Chat history error:", error);

    }

}


/* ================= SAVE CHAT ================= */

function saveMessage(role, content) {

    const messages =
        JSON.parse(localStorage.getItem("jaxx_messages") || "[]");

    messages.push({
        role,
        content
    });

    localStorage.setItem(
        "jaxx_messages",
        JSON.stringify(messages)
    );
}


/* ================= ADD MESSAGE ================= */

function addMessageToUI(role, content) {

    const wrapper = document.createElement("div");

    wrapper.className =
        `message ${role === "user" ? "user" : "ai"}`;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = content;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    return wrapper;
}


/* ================= TYPING ================= */

function showTyping() {

    const wrapper = document.createElement("div");

    wrapper.className = "message ai";
    wrapper.id = "typingMessage";

    wrapper.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
}


function removeTyping() {

    document.getElementById("typingMessage")?.remove();

}


/* ================= SUGGESTION ================= */

function useSuggestion(text) {

    input.value = text;

    input.focus();

}


/* ================= FILE ================= */

function handleFile(inputElement) {

    const file = inputElement.files[0];

    if (!file) return;

    selectedFile = file;

    fileName.textContent =
        `📎 ${file.name}`;

    filePreview.classList.add("show");

}


function removeFile() {

    selectedFile = null;

    fileInput.value = "";

    filePreview.classList.remove("show");

}


/* ================= SEND MESSAGE ================= */

async function sendMessage() {

    const message = input.value.trim();

    if (!message && !selectedFile) return;


    document.getElementById("welcome")?.remove();

    suggestions.style.display = "none";


    if (message) {

        addMessageToUI("user", message);

        saveMessage("user", message);

    }


    showTyping();


    try {

        let response;


        /* FILE UPLOAD */

        if (selectedFile) {

            const formData = new FormData();

            formData.append("file", selectedFile);

            formData.append("message", message);


            response = await fetch("/api/upload", {
                method: "POST",
                body: formData
            });


        }

        /* NORMAL CHAT */

        else {

            const messages =
                JSON.parse(
                    localStorage.getItem("jaxx_messages") || "[]"
                );

            response = await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    messages
                })

            });

        }


        const data = await response.json();

        removeTyping();


        if (!response.ok) {

            throw new Error(
                data.error || "Something went wrong"
            );

        }


        const reply =
            data.reply || "I couldn't generate a response.";


        addMessageToUI("ai", reply);

        saveMessage("assistant", reply);


    } catch (error) {

        removeTyping();

        console.error(error);

        const errorMessage =
            "❌ " + (error.message || "Something went wrong.");

        addMessageToUI("ai", errorMessage);

    }


    input.value = "";

    removeFile();

}


/* ================= VIDEO PANEL ================= */

function toggleVideoPanel() {

    const panel =
        document.getElementById("videoPanel");

    panel.classList.toggle("show");

}


/* ================= GENERATE VIDEO ================= */

async function generateVideo() {

    const prompt =
        document.getElementById("videoPrompt").value.trim();

    const duration =
        Number(
            document.getElementById("videoDuration").value
        );

    const ratio =
        document.getElementById("videoRatio").value;

    const button =
        document.getElementById("generateVideoBtn");

    const status =
        document.getElementById("videoStatus");


    if (!prompt) {

        status.textContent =
            "⚠️ Pehle video ka prompt likho.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "⏳ Generating...";

    status.textContent =
        "🎬 JAXX is creating your video... This may take a little while.";


    try {

        const response =
            await fetch("/api/generate-video", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    prompt,
                    duration,
                    ratio
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Video generation failed."
            );

        }


        if (!data.videoUrl) {

            throw new Error(
                "Video URL nahi mila."
            );

        }


        status.textContent =
            "✅ Video generated successfully!";


        /* ADD VIDEO TO CHAT */

        const wrapper =
            document.createElement("div");

        wrapper.className = "message ai";


        const bubble =
            document.createElement("div");

        bubble.className = "bubble";


        const title =
            document.createElement("div");

        title.textContent =
            "🎬 Here's your generated video:";


        const video =
            document.createElement("video");

        video.className =
            "generated-video";

        video.controls = true;

        video.playsInline = true;

        video.src =
            data.videoUrl;


        const download =
            document.createElement("a");

        download.className =
            "download-video";

        download.href =
            data.videoUrl;

        download.target =
            "_blank";

        download.rel =
            "noopener noreferrer";

        download.textContent =
            "▶ Open Video";


        bubble.appendChild(title);

        bubble.appendChild(video);

        bubble.appendChild(download);

        wrapper.appendChild(bubble);

        chat.appendChild(wrapper);


        chat.scrollTop =
            chat.scrollHeight;


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ " +
            (error.message ||
            "Video generation failed.");

    }


    button.disabled = false;

    button.textContent =
        "✨ Generate Video";

}


/* ================= NEW CHAT ================= */

function newChat() {

    localStorage.removeItem("jaxx_messages");

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Hey 👋 I'm JAXX</h1>
            <p>Your AI assistant — ask me anything.</p>
        </div>
    `;


    suggestions.style.display = "flex";


    document.getElementById("videoPrompt").value = "";

    document.getElementById("videoStatus").textContent = "";

    document.getElementById("videoPanel")
        .classList.remove("show");


    input.value = "";

    removeFile();

}


/* ================= ENTER TO SEND ================= */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

});


/* ================= AUTO RESIZE ================= */

input.addEventListener("input", function() {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 150) + "px";

});


/* ================= START ================= */

loadChat();

</script>

</body>
</html>
