<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAXX AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, #18214a 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #25133d 0%, transparent 30%),
                #070912;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 270px;
            background: rgba(8, 11, 25, 0.88);
            border-right: 1px solid rgba(255,255,255,.08);
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #7c5cff;
        }

        .new-chat {
            border: none;
            background: linear-gradient(135deg,#7c5cff,#b14cff);
            color: white;
            padding: 14px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: .2s;
        }

        .new-chat:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124,92,255,.3);
        }

        .menu-title {
            margin-top: 30px;
            margin-bottom: 12px;
            color: #777f9a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history {
            color: #bfc5dc;
            font-size: 14px;
            line-height: 2.6;
        }

        .history div {
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .history div:hover {
            background: rgba(255,255,255,.05);
        }

        .bottom {
            margin-top: auto;
            color: #727991;
            font-size: 12px;
            text-align: center;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 70px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(5,7,17,.55);
            backdrop-filter: blur(20px);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #b9c0d6;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #39e58c;
            border-radius: 50%;
            box-shadow: 0 0 15px #39e58c;
        }

        .model {
            color: #8d95ad;
            font-size: 13px;
        }

        /* CHAT */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 40px 10%;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 850px;
            margin: 7vh auto 0;
            text-align: center;
        }

        .ai-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            background: linear-gradient(135deg,#7c5cff,#b64cff);
            box-shadow: 0 0 50px rgba(124,92,255,.35);
        }

        .welcome h1 {
            margin-top: 25px;
            font-size: 42px;
        }

        .welcome h1 span {
            color: #9579ff;
        }

        .welcome p {
            color: #8991aa;
            margin-top: 12px;
            font-size: 16px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 14px;
            margin-top: 35px;
        }

        .suggestion {
            padding: 18px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            background: rgba(255,255,255,.035);
            color: #c7cce0;
            cursor: pointer;
            text-align: left;
            transition: .2s;
        }

        .suggestion:hover {
            border-color: rgba(124,92,255,.5);
            transform: translateY(-2px);
        }

        /* MESSAGES */

        .message {
            max-width: 900px;
            margin: 0 auto 25px;
            display: flex;
            gap: 14px;
        }

        .avatar {
            min-width: 38px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: #20263a;
        }

        .message.user .avatar {
            background: linear-gradient(135deg,#7c5cff,#b14cff);
        }

        .bubble {
            padding: 13px 17px;
            border-radius: 15px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.06);
            line-height: 1.65;
            color: #dce1f2;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .bubble {
            background: linear-gradient(135deg,#513bc0,#7132a8);
            border: none;
        }

        /* INPUT */

        .input-area {
            padding: 15px 8% 25px;
            background: linear-gradient(transparent,#070912 35%);
        }

        .input-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 10px;
            border-radius: 18px;
            background: rgba(19,23,40,.95);
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 15px;
            min-height: 45px;
            max-height: 150px;
            padding: 12px;
        }

        textarea::placeholder {
            color: #6f768d;
        }

        .send {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg,#7c5cff,#b14cff);
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .send:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .hint {
            text-align: center;
            color: #555d73;
            font-size: 11px;
            margin-top: 9px;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 5px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8b76ff;
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%,100% {
                transform: translateY(0);
                opacity: .4;
            }

            50% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* MOBILE */

        @media(max-width:800px) {

            .sidebar {
                display: none;
            }

            .chat {
                padding: 25px 15px;
            }

            .input-area {
                padding: 10px 15px 18px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .model {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            JAXX<span>AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="menu-title">
            Recent Chats
        </div>

        <div class="history" id="history">
            <div>💬 Welcome to JAXX</div>
        </div>

        <div class="bottom">
            JAXX AI • Powered by OpenAI
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="status">
                <div class="dot"></div>
                AI Online
            </div>

            <div class="model">
                GPT-5.6 Luna
            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="ai-icon">
                    ✦
                </div>

                <h1>
                    Meet <span>JAXX AI</span>
                </h1>

                <p>
                    Your intelligent AI assistant for coding, study,
                    ideas and everyday questions.
                </p>

                <div class="suggestions">

                    <div class="suggestion"
                         onclick="useSuggestion('Explain artificial intelligence in simple words')">
                        🧠 Explain something
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('Give me a cool HTML project idea')">
                        💻 Build something
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('Help me make a study timetable')">
                        📚 Study help
                    </div>

                    <div class="suggestion"
                         onclick="useSuggestion('Tell me an interesting fact')">
                        ✨ Interesting fact
                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Message JAXX AI..."
                    rows="1"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="hint">
                Enter to send • Shift + Enter for new line
            </div>

        </div>

    </main>

</div>


<script>

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    let messages = [];


    /* ENTER TO SEND */

    input.addEventListener("keydown", function(e) {

        if (e.key === "Enter" && !e.shiftKey) {

            e.preventDefault();

            sendMessage();

        }

    });


    /* AUTO RESIZE */

    input.addEventListener("input", function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(this.scrollHeight,150) + "px";

    });


    /* SUGGESTION */

    function useSuggestion(text) {

        input.value = text;

        input.focus();

        sendMessage();

    }


    /* ADD MESSAGE */

    function addMessage(role, text) {

        const currentWelcome =
            document.getElementById("welcome");

        if (currentWelcome) {

            currentWelcome.style.display = "none";

        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message " + role;


        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";


        avatar.textContent =
            role === "user" ? "👤" : "✦";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        bubble.textContent =
            text;


        wrapper.appendChild(avatar);

        wrapper.appendChild(bubble);

        chat.appendChild(wrapper);


        chat.scrollTop =
            chat.scrollHeight;


        return wrapper;

    }


    /* TYPING */

    function showTyping() {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message assistant";

        wrapper.id =
            "typing";


        wrapper.innerHTML = `

            <div class="avatar">
                ✦
            </div>

            <div class="bubble">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        `;


        chat.appendChild(wrapper);

        chat.scrollTop =
            chat.scrollHeight;

    }


    function removeTyping() {

        const typing =
            document.getElementById("typing");

        if (typing) {

            typing.remove();

        }

    }


    /* SEND MESSAGE */

    async function sendMessage() {

        const text =
            input.value.trim();


        if (!text || send.disabled)
            return;


        addMessage(
            "user",
            text
        );


        messages.push({

            role: "user",

            content: text

        });


        input.value = "";

        input.style.height =
            "auto";


        send.disabled =
            true;


        showTyping();


        try {

            const response =
                await fetch("/api/chat", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        messages:
                            messages

                    })

                });


            const data =
                await response.json();


            removeTyping();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Server error"
                );

            }


            const reply =
                data.reply ||
                "No response received.";


            addMessage(
                "assistant",
                reply
            );


            messages.push({

                role: "assistant",

                content: reply

            });


            saveChat();


        }

        catch (error) {

            removeTyping();


            addMessage(

                "assistant",

                "⚠️ AI response nahi aa paaya.\n\n" +

                "Server/API key check karo.\n\n" +

                "Error: " +
                error.message

            );


            console.error(error);

        }

        finally {

            send.disabled =
                false;

            input.focus();

        }

    }


    /* NEW CHAT */

    function newChat() {

        messages = [];


        chat.innerHTML = `

            <div class="welcome"
                 id="welcome">

                <div class="ai-icon">
                    ✦
                </div>

                <h1>
                    Meet <span>JAXX AI</span>
                </h1>

                <p>
                    Your intelligent AI assistant for coding,
                    study, ideas and everyday questions.
                </p>

                <div class="suggestions">

                    <div
                        class="suggestion"
                        onclick="useSuggestion('Explain artificial intelligence in simple words')">

                        🧠 Explain something

                    </div>


                    <div
                        class="suggestion"
                        onclick="useSuggestion('Give me a cool HTML project idea')">

                        💻 Build something

                    </div>


                    <div
                        class="suggestion"
                        onclick="useSuggestion('Help me make a study timetable')">

                        📚 Study help

                    </div>


                    <div
                        class="suggestion"
                        onclick="useSuggestion('Tell me an interesting fact')">

                        ✨ Interesting fact

                    </div>

                </div>

            </div>

        `;


        localStorage.removeItem(
            "jaxx_messages"
        );

    }


    /* SAVE */

    function saveChat() {

        localStorage.setItem(

            "jaxx_messages",

            JSON.stringify(messages)

        );

    }


    /* LOAD */

    function loadChat() {

        const saved =
            localStorage.getItem(
                "jaxx_messages"
            );


        if (!saved)
            return;


        try {

            messages =
                JSON.parse(saved);


            messages.forEach(
                message => {

                    addMessage(

                        message.role,

                        message.content

                    );

                }
            );

        }

        catch {

            messages = [];

        }

    }


    loadChat();

</script>

</body>
</html>
